name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local
      - name: Add local test settings
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          echo "SUPABASE_URL=$(sed -n 's/^API_URL=//p' /tmp/supabase.env)" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$(sed -n 's/^SERVICE_ROLE_KEY=//p' /tmp/supabase.env)" >> "$GITHUB_ENV"
          echo "DEMO_EVENT_SIGNING_SECRET=ci-only-fake-signing-secret-with-more-than-32-characters" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:db
      - run: pnpm test:concurrency
      - run: pnpm build
      - run: pnpm test:e2e
        env:
          CAPTURE_DEMO_SCREENSHOT: "true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-evidence
          path: |
            artifacts/demo-workflow.png
            test-results/
          if-no-files-found: ignore
          retention-days: 14
